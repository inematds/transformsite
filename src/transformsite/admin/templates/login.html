{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Entrar no painel</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <p><input type="password" name="token" placeholder="token do painel" autofocus style="width:100%"></p>
    <button class="pri" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}

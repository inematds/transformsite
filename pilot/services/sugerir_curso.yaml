service: sugerir_curso
version: 1
review: approved
intent:
  description: "Sugerir um tema de curso ou guia"
  examples:
    - "quero sugerir um curso"
    - "sugestão de curso"
    - "vocês podiam fazer um curso sobre"
    - "sugerir um tema"
  keywords: ["sugerir curso", "sugestão de curso", "novo curso"]
auth: none
legal_basis: consentimento
slots:
  - {name: tema, type: text, prompt: "Qual tema você gostaria de ver num curso ou guia?", max_len: 300}
  - name: nivel
    type: enum
    values: [iniciante, intermediario, avancado]
    labels: {iniciante: "Iniciante", intermediario: "Intermediário", avancado: "Avançado"}
    synonyms: {iniciante: ["basico", "zero", "comecando"], avancado: ["expert", "profissional"]}
    prompt: "Para qual nível?"
  - {name: email, type: email, required: false, prompt: "Quer receber aviso quando sair? Deixe seu e-mail.", prefill_from: channel.user_email}
confirm:
  template: "Registro a sugestão \"{tema|trunc80}\" (nível {nivel}). Confirma?"
action:
  tool: crm.criar_ticket
  args: {subject: "[sugestão de curso] {tema|trunc80}", body: "Tema: {tema}\nNível: {nivel}\nE-mail: {email}", queue: conteudo}
  idempotency_key: "{session_id}:sugestao:{tema|trunc80}"
on_success:
  reply: "Obrigado! Sugestão registrada ({result.id}). Os cursos do INEMA.CLUB são abertos e gratuitos — fique de olho em inema.club/cursos."

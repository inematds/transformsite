<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Ouvidoria - Prefeitura de Vale Verde</title></head>
<body>
<h1>Ouvidoria Municipal</h1>
<form action="https://ouvidoria.valeverde.rs.gov.br/manifestacao" method="post">
  <fieldset>
    <legend>Tipo de manifestação *</legend>
    <input type="radio" id="t1" name="tipo" value="reclamacao" required><label for="t1">Reclamação</label>
    <input type="radio" id="t2" name="tipo" value="denuncia"><label for="t2">Denúncia</label>
    <input type="radio" id="t3" name="tipo" value="sugestao"><label for="t3">Sugestão</label>
    <input type="radio" id="t4" name="tipo" value="elogio"><label for="t4">Elogio</label>
  </fieldset>
  <fieldset>
    <legend>Deseja se identificar?</legend>
    <label><input type="radio" name="identificar" value="sim" checked> Sim</label>
    <label><input type="radio" name="identificar" value="nao"> Não (anônimo)</label>
  </fieldset>
  <div data-show-if="identificar=sim">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email">
  </div>
  <label for="secretaria">Secretaria envolvida</label>
  <select id="secretaria" name="secretaria">
    <option value="saude">Saúde</option>
    <option value="educacao">Educação</option>
    <option value="obras">Obras e Viação</option>
    <option value="outra">Outra</option>
  </select>
  <label for="relato">Relato *</label>
  <textarea id="relato" name="relato" required maxlength="4000"></textarea>
  <button type="submit">Registrar</button>
</form>
</body>
</html>

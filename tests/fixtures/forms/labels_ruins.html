<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Trabalhe Conosco</title></head>
<body>
<div class="box">
  <h3>Envie seu currículo</h3>
  <form action="https://rh.transportesrapido.com.br/cv.php" method="post">
    <input type="text" name="f1" placeholder="Nome completo*">
    <input type="text" name="f2" placeholder="E-mail*">
    <input type="text" name="f3" placeholder="Telefone com DDD">
    <input type="text" name="f4" placeholder="Cidade onde mora">
    <input type="text" name="f5" placeholder="Data de nascimento (dd/mm/aaaa)">
    <select name="f6">
      <option value="">Vaga de interesse</option>
      <option value="motorista">Motorista</option>
      <option value="ajudante">Ajudante de carga</option>
      <option value="adm">Administrativo</option>
    </select>
    <input type="text" name="f7" placeholder="Pretensão salarial">
    <textarea name="f8" placeholder="Fale um pouco sobre você"></textarea>
    <input type="text" name="f9" placeholder="CEP">
    <input type="submit" value="Enviar">
  </form>
</div>
</body>
</html>

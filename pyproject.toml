[project]
name = "transformsite"
version = "0.1.0"
description = "Transforme seu site e sua base de conhecimento em um agente de chat (Telegram, WhatsApp, e-mail, web) que responde com fonte e executa serviços."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "INEMA", email = "inematds@gmail.com" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "jinja2>=3.1",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transformsite = "transformsite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformsite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
